<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#090b10">
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/deck-player.css' | relative_url }}">
  </head>
  <body class="deck-page">
    <main
      class="deck-player"
      data-deck-manifest="{{ page.deck_manifest | escape }}"
      aria-label="{{ page.title | escape }} presentation"
    >
      <header class="deck-player__header">
        <a class="deck-player__back" href="{{ '/talks/' | relative_url }}">← Talks</a>
        <h1 class="deck-player__title">{{ page.title | escape }}</h1>
        {% if page.pdf_url %}
          <a class="deck-player__download" href="{{ page.pdf_url | escape }}">PDF</a>
        {% else %}
          <span aria-hidden="true"></span>
        {% endif %}
      </header>

      <section class="deck-player__viewport" aria-label="Slide viewer">
        <div class="deck-player__stage" tabindex="0">
          <div class="deck-player__slide"></div>
          <p class="deck-player__message" role="status" aria-live="polite">Loading presentation…</p>
        </div>
      </section>

      <nav class="deck-player__controls" aria-label="Presentation controls">
        <button class="deck-player__button" type="button" data-deck-action="previous" aria-label="Previous slide">←</button>
        <output class="deck-player__counter" aria-live="polite">– / –</output>
        <button class="deck-player__button" type="button" data-deck-action="next" aria-label="Next slide">→</button>
        <button class="deck-player__button" type="button" data-deck-action="fullscreen" aria-label="Enter fullscreen">⛶</button>
      </nav>
    </main>

    <noscript>This presentation viewer requires JavaScript.</noscript>
    <script src="{{ '/assets/js/deck-player.js' | relative_url }}" defer></script>
  </body>
</html>
