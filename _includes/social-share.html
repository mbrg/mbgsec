{% assign locale = include.locale | default: site.locale %}
{% assign page_url = page.url | absolute_url | url_encode %}
{% assign page_title = page.title | default: site.title | url_encode %}
<section class="page__share" aria-labelledby="share-title">
  <h2 class="page__share-title" id="share-title">{{ site.data.ui-text[locale].share_on_label | default: "Share on" }}</h2>
  <a href="https://x.com/intent/tweet?via={{ site.twitter.username | replace: '@', '' }}&amp;text={{ page_title }}%20{{ page_url }}" class="btn btn--x" aria-label="Share on X" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;">
    <i class="fab fa-fw fa-x-twitter" aria-hidden="true"></i><span> X</span>
  </a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ page_url }}" class="btn btn--facebook" aria-label="Share on Facebook" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;">
    <i class="fab fa-fw fa-facebook" aria-hidden="true"></i><span> Facebook</span>
  </a>
  <a href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{ page_url }}" class="btn btn--linkedin" aria-label="Share on LinkedIn" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;">
    <i class="fab fa-fw fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span>
  </a>
  <a href="https://bsky.app/intent/compose?text={{ page_title }}%20{{ page_url }}" class="btn btn--bluesky" aria-label="Share on Bluesky" onclick="window.open(this.href, 'window', 'left=20,top=20,width=500,height=500,toolbar=1,resizable=0'); return false;">
    <i class="fab fa-fw fa-bluesky" aria-hidden="true"></i><span> Bluesky</span>
  </a>
</section>
