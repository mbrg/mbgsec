name: LLM Readiness and Lighthouse

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site
        run: bundle exec jekyll build

      - name: Validate LLM contracts end to end
        run: npm run validate:llm

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x

      - name: Enforce Lighthouse budgets
        run: lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
